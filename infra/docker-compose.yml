services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: complaint-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: complaint
      POSTGRES_PASSWORD: complaint
      POSTGRES_DB: complaint_platform

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: